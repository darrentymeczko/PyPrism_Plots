[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pyprism-plot"
version = "0.3.0"
description = "Prism-inspired publication styling for Matplotlib and Seaborn"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "darrentymeczko" },
]
keywords = ["matplotlib", "seaborn", "scientific-plotting", "visualization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.23",
]

[project.optional-dependencies]
examples = ["numpy>=1.26", "pandas>=2.1", "seaborn>=0.13"]
dev = [
  "build>=1.2",
  "numpy>=1.26",
  "pandas>=2.1",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
  "seaborn>=0.13",
  "twine>=5",
]

[project.urls]
Homepage = "https://github.com/darrentymeczko/PyPrism_Plots"
Issues = "https://github.com/darrentymeczko/PyPrism_Plots/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pyprism_plot"]

[tool.pytest.ini_options]
addopts = "--cov=pyprism_plot --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
